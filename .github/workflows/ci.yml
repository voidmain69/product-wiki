name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  # Гвард архітектури — zero-deps, працює без install. Найшвидший сигнал.
  architecture:
    name: Architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
      - name: Layer boundaries & conventions
        run: node scripts/check-arch.mjs

  quality:
    name: Quality (typecheck, lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # версію pnpm бере з поля packageManager у package.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: Build web (Next.js SSR)
        run: pnpm --filter @wiki/web build

  # Python ML-сервіс: синтаксис + компіляція (повний lint — Фаза 2)
  ml-service:
    name: ML service (py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile check
        run: python -m py_compile services/ml/app.py
