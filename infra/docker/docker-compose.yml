name: product-wiki

# Dev-інфраструктура одним `pnpm infra:up`. Продакшн — k8s (infra/k8s).
# Host-порти конфігуруються через env (`*_PORT`), щоб проєкт співіснував з іншими
# локальними стеками. Дефолти — стандартні; переозначай у .env за конфлікту.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wiki
      POSTGRES_PASSWORD: wiki
      POSTGRES_DB: wiki
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./volumes/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiki"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.10-alpine
    # -js вмикає JetStream (persistence + consumer groups + replay)
    command: ["-js", "-m", "8222"]
    ports:
      - "${NATS_PORT:-4222}:4222" # клієнти
      - "${NATS_MONITOR_PORT:-8222}:8222" # моніторинг
    volumes:
      - ./volumes/nats:/data

  qdrant:
    image: qdrant/qdrant:v1.12.1
    ports:
      - "${QDRANT_PORT:-6333}:6333" # REST
      - "${QDRANT_GRPC_PORT:-6334}:6334" # gRPC
    volumes:
      - ./volumes/qdrant:/qdrant/storage

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./volumes/redis:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${S3_PORT:-9000}:9000" # S3 API
      - "${S3_CONSOLE_PORT:-9001}:9001" # консоль
    volumes:
      - ./volumes/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # створює бакет для снапшотів при старті
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (mc alias set local http://minio:9000 minioadmin minioadmin) do sleep 2; done;
      mc mb --ignore-existing local/snapshots;
      mc anonymous set download local/snapshots;
      exit 0;
      "
