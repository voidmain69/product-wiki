[project]
name = "wiki-ml"
version = "0.1.0"
description = "Embedding (BGE-M3) + rerank (bge-reranker-v2-m3) inference service"
requires-python = ">=3.10"
# Базові залежності — легкі; вистачає для dev-режиму (ML_DEV_MODE=1) без torch.
dependencies = [
    "fastapi>=0.139.2",
    "uvicorn[standard]>=0.51.0",
    "numpy>=1.26",
    "pydantic>=2.0",
]

[project.optional-dependencies]
# Продакшн-інференс: реальні моделі (torch тягнеться транзитивно, ~2 ГБ).
prod = ["FlagEmbedding>=1.3.0"]

[tool.uv]
dev-dependencies = ["ruff>=0.6"]
